stages:
  - lint
  - test
  - build
  - deploy

lint:
  stage: lint
  image: python:3.12

  before_script:
    - pip install -r requirements.txt
    - pip install ruff

  script:
    - ruff check .

test:
  stage: test
  image: python:3.12

  before_script:
    - pip install -r requirements.txt
    - pip install pytest httpx2

  script:
    - python -m pytest tests

build:
  stage: build
  image: docker:27-dind

  before_script:
    - unset DOCKER_HOST

  script:
    - docker info >/dev/null 2>&1 || (dockerd >/tmp/dockerd.log 2>&1 &)
    - for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
    - docker info
    - docker compose build

deploy:
  stage: deploy
  when: manual
  script:
    - echo "Deploying on this machine (the runner is on your PC)..."
    - docker compose up -d --build
