stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: python:3.12

  before_script:
    - pip install -r requirements.txt
    - pip install ruff

  script:
    - ruff check .

test:
  stage: test
  image: python:3.12

  before_script:
    - pip install -r requirements.txt
    - pip install pytest httpx2

  script:
    - python -m pytest tests

build:
  stage: build
  image: docker:27

  before_script:
    - unset DOCKER_HOST

  script:
    - docker compose build
