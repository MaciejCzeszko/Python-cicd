<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Click counter</title>
    <style>
      :root {
        --bg: #e8eef5;
        --ink: #14213d;
        --accent: #2f4bff;
        --accent-press: #1f35c9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: auto auto auto;
        grid-template-rows: auto auto auto;
        align-items: center;
        justify-items: center;
        column-gap: 4rem;
        row-gap: 1.5rem;
      }
      #counter {
        display: contents;
        gap: 2rem;
        font-size: clamp(5rem, 22vw, 11rem);
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #save {
        display: contents;
        gap: 2rem;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      #count {
        grid-column: 1;
        grid-row: 1 / 3;
      }
      #btn_count {
        grid-column: 1;
        grid-row: 3;
      }

      h1 {
        grid-column: 3;
        grid-row: 1;
        margin: 0;
      }
      #name {
        grid-column: 3;
        grid-row: 2;
      }
      #btn_save {
        grid-column: 3;
        grid-row: 3;
      }
      button {
        font: inherit;
        font-size: 1.25rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        padding: 1rem 2.75rem;
        cursor: pointer;
        transition:
          transform 80ms ease,
          background-color 120ms ease;
      }
      button:hover {
        background: var(--accent-press);
      }
      button:active {
        transform: scale(0.96);
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="counter">
        <div id="count" aria-live="polite">__COUNT__</div>
        <button id="btn_count" type="button">Click me</button>
      </div>
      <div id="save">
        <h1>Enter your name:</h1>
        <input id="name" type="text" />
        <button id="btn_save" type="submit">Save score</button>
      </div>
    </main>
    <table id="scores_table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      async function loadScores() {
        const res = await fetch("api/scores");
        if (!res.ok) {
          console.error("Failed to load scores");
          return;
        }
        const scores = await res.json();

        const tbody = document.querySelector("#scores_table tbody");
        tbody.innerHTML = "";

        for (const row of scores) {
          const tr = document.createElement("tr");

          const nameTd = document.createElement("td");
          nameTd.textContent = row.name;

          const scoreTd = document.createElement("td");
          scoreTd.textContent = row.score;

          tr.append(nameTd, scoreTd);
          tbody.appendChild(tr);
        }
      }

      loadScores();

      const countEl = document.getElementById("count");
      document
        .getElementById("btn_count")
        .addEventListener("click", async () => {
          try {
            const res = await fetch("/api/click", { method: "POST" });
            const data = await res.json();
            countEl.textContent = data.count;
          } catch (err) {
            console.error("Could not update the counter:", err);
          }
        });
      document
        .getElementById("btn_save")
        .addEventListener("click", async () => {
          const name = document.getElementById("name").value.trim();

          const res = await fetch("/api/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name }),
          });

          if (res.ok) {
            const data = await res.json();
            document.getElementById("count").textContent = data.count;
            await loadScores();
            alert("Saved!");
          } else {
            alert("Something went wrong");
          }
        });
    </script>
  </body>
</html>
